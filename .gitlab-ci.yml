# Operational branch: scheduled release synchronization only.
# Normal Encore build CI remains on main. Do not merge this CI file to main.
workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "codex/github-release-mirror" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "codex/github-release-mirror" && $CI_PIPELINE_SOURCE == "web"'
    - when: never

stages: [publish]

github:releases:
  stage: publish
  tags: [windows, windows-11]
  resource_group: github-release-mirror
  timeout: 30 minutes
  script:
    - python -m unittest discover -s tests -p test_github_mirror.py
    - python scripts/mirror-github-releases.py

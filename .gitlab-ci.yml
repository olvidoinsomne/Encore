include:
  - component: $CI_SERVER_FQDN/pipelines/pipeline-master/build@1.0.0
    inputs:
      stage: verify
      strict: true

stages: [verify, package]

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-ci"

pm:rust:
  script:
    - pm_each pm_rust "$(pm_roots_rust)"
    - pm_finish
    - sh scripts/package-linux.sh
  artifacts:
    paths: [pm-artifacts/, dist/*.tar.gz]

pm:rust:macos:
  script:
    - pm_each pm_rust "$(pm_roots_rust)"
    - pm_finish
    - sh scripts/package-macos.sh "$CARGO_TARGET_DIR/release/encore"
  artifacts:
    paths: [pm-artifacts/, dist/*.zip]

windows:package:
  stage: package
  tags:
    - windows
    - encore-native
  rules:
    - when: manual
      allow_failure: true
  script:
    - cargo fmt --all -- --check
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo test --locked --all-targets
    - cargo build --release --locked
    - pwsh -NoProfile -File scripts/package-windows.ps1
  artifacts:
    name: "Encore-windows-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/*.zip
